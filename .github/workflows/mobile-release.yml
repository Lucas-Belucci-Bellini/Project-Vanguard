name: Vanguard Mobile Artifacts and Release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão esperada no package.json; vazio usa a versão do pacote'
        required: false
        default: '1.3.1'
      publish_tag:
        description: 'Tag para publicar release; vazio = apenas artifacts de teste'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    name: Android artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependências
        run: npm ci
      - name: Build web + sincronizar Capacitor Android
        run: npm run mobile:sync:android
      - name: Verificar versão solicitada
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="${REQUESTED_VERSION:-$VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then EXPECTED="${GITHUB_REF_NAME#mobile-v}"; elif [[ -n "$PUBLISH_TAG" ]]; then EXPECTED="${PUBLISH_TAG#mobile-v}"; fi
          test "$VERSION" = "$EXPECTED"
          echo "Build version verified: $VERSION"
      - name: APK debug — artifact de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: AAB release — não assinado
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Gerar manifesto e checksums
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p mobile-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "mobile-artifacts/vanguard-$VERSION-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "mobile-artifacts/vanguard-$VERSION-release-unsigned.aab"
          sha256sum mobile-artifacts/* > mobile-artifacts/SHA256SUMS
          # Impressão do certificado que assinou o APK. É o número que o
          # Android compara para decidir se a atualização pode substituir o app
          # instalado: se ele mudar entre duas versões, a instalação falha por
          # conflito de assinatura. Registrar aqui torna isso conferível sem
          # precisar do aparelho.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            CERT=$("$APKSIGNER" verify --print-certs "mobile-artifacts/vanguard-$VERSION-debug.apk" \
                   | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          else
            CERT="apksigner-indisponivel"
          fi
          echo "APK signing certificate SHA-256: $CERT"
          cat > mobile-artifacts/BUILD-MANIFEST.txt <<EOF
          product=Vanguard Field
          version=$VERSION
          commit=$GITHUB_SHA
          ref=$GITHUB_REF
          signed_android=debug-key-fixa
          apk_signing_cert_sha256=$CERT
          ios_artifact=false
          physical_device_test=false
          EOF
      - name: Upload pacote de evidência da build
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-mobile-build-evidence
          path: mobile-artifacts/
          if-no-files-found: error
      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload AAB não assinado
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-android-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publicar release explicitamente solicitada
        if: startsWith(github.ref, 'refs/tags/mobile-v') || inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.publish_tag || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=/tmp/vanguard-release-notes.md
          cat > "$NOTES" <<'EOF'
          ## Vanguard Field mobile
          Artifacts Android para teste interno. O APK é debug e o AAB é não assinado. A build não comprova teste físico nem substitui assinatura de produção.

          ### ⚠️ Vindo da 1.1.0, 1.2.0 ou 1.3.1: DESINSTALE antes

          A chave de assinatura passou a ser fixa e versionada na 1.3.2 (ADR-0042).
          O Android **recusa** substituir um app instalado por outro assinado com
          certificado diferente: a instalação falha, e o aparelho **continua na
          versão antiga** — sem página nova, sem correção nenhuma, e sem erro que
          explique o motivo. É assim que "o site tem telas que o app não tem"
          acontece sem nenhum defeito de build.

          Confira em **Diagnóstico → BUILD / RUNTIME** qual versão o aparelho está
          realmente rodando. Se não for a desta release, desinstale e instale de novo.
          O `apk_signing_cert_sha256` no `BUILD-MANIFEST.txt` é o número que o
          Android compara.
          EOF
          PRERELEASE=''
          if [[ "$RELEASE_TAG" == *-rc* || "$RELEASE_TAG" == *-beta* || "$RELEASE_TAG" == *-alpha* ]]; then PRERELEASE='--prerelease'; fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Vanguard Field $RELEASE_TAG" $PRERELEASE --notes-file "$NOTES" mobile-artifacts/vanguard-*-debug.apk mobile-artifacts/vanguard-*-release-unsigned.aab mobile-artifacts/BUILD-MANIFEST.txt mobile-artifacts/SHA256SUMS
