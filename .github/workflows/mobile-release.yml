name: Vanguard Mobile Artifacts and Release

# Build técnico e release são caminhos distintos.
#
# - workflow_dispatch sem publish_tag: apenas gera APK debug e AAB não assinado
#   como artifacts para teste.
# - push de uma tag mobile-v*: gera os mesmos artifacts e publica a release da
#   tag.
# - workflow_dispatch com publish_tag: gera os artifacts e publica explicitamente
#   a tag informada.
#
# Assinatura Android de produção e iOS continuam fora deste runner: o Android
# precisa de keystore seguro e a IPA exige macOS/Xcode/conta Apple.
on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão esperada no package.json; vazio usa a versão do pacote'
        required: false
        default: '1.0.0'
      publish_tag:
        description: 'Tag para publicar release; vazio = apenas artifacts de teste'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    name: Android artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Build web + sincronizar Capacitor Android
        run: npm run mobile:sync:android

      - name: Verificar versão solicitada
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="${REQUESTED_VERSION:-$VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            EXPECTED="${GITHUB_REF_NAME#mobile-v}"
          elif [[ -n "$PUBLISH_TAG" ]]; then
            EXPECTED="${PUBLISH_TAG#mobile-v}"
          fi
          test "$VERSION" = "$EXPECTED"
          echo "Build version verified: $VERSION"

      - name: APK debug — artifact de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: AAB release — não assinado
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB não assinado
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-android-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publicar release explicitamente solicitada
        if: startsWith(github.ref, 'refs/tags/mobile-v') || inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.publish_tag || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=/tmp/vanguard-release-notes.md
          cat > "$NOTES" <<'EOF'
          ## Vanguard Field mobile

          Esta publicação contém artifacts Android gerados pelo workflow móvel.

          - `app-debug.apk`: artifact de teste interno; não é pacote de loja.
          - `app-release.aab`: AAB não assinado; exige keystore e assinatura antes da distribuição.
          - iOS: build local em macOS/Xcode, com assinatura Apple.

          A existência do build não significa que o app tenha sido testado em aparelho real nem que uma IPA ou pacote Android assinado tenha sido publicado.
          EOF
          PRERELEASE=''
          if [[ "$RELEASE_TAG" == *-rc* || "$RELEASE_TAG" == *-beta* || "$RELEASE_TAG" == *-alpha* ]]; then
            PRERELEASE='--prerelease'
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Vanguard Field $RELEASE_TAG" \
            $PRERELEASE \
            --notes-file "$NOTES" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/bundle/release/app-release.aab
